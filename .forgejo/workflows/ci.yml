# CI for psstools/sphinx-pss on Forgejo Actions.
#
# Ported from psstools/pssparser's workflow, and the same constraint applies:
# no third-party actions. A bare `uses:` resolves against code.forgejo.org
# (Forgejo's DEFAULT_ACTIONS_URL), not github.com.
#
# The cost question this project had to settle (implementation-plan section 10):
# pssparser is a C++/Cython extension. It used to be built from source here,
# through ivpm, in the pssparser CI container. It now comes from pssparser's
# **published wheel on PyPI**, resolved by pip from the floor in pyproject.toml,
# which is exactly what a user installs. That tests sphinx-pss against the
# latest release, not against pssparser's moving default branch: a parser
# change reaches this job only once it is released. The nightly workflow still
# builds pssparser from source, deliberately unpinned, so upstream drift shows
# up there first (nightly.yml).
#
# The pssparser CI container is kept only for its Python interpreters and dnf:
# nothing here compiles.
name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

env:
  PY: /opt/python/cp312-cp312/bin/python

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: dvkit/pssparser-ci:manylinux_2_28-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Check for internal identifiers in tracked files
      # This repo is published, so anything committed here is public. Internal
      # host names, tailnet addresses and CGNAT-range IPs must not appear in
      # tracked files; if a build ever needs one, it belongs in a repository
      # secret, which is masked in logs.
      run: |
        pattern='\.ts\.net|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/ci.yml' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: Install sphinx-pss and its dependencies
      # pip resolves everything, pssparser included, from PyPI.
      run: |
        ${PY} -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -e ".[test,docs]"
        python -m pip list | grep -i -E "^(pssparser|pygments-pss|sphinx) "

    - name: Verify pssparser can extract doc comments
      # sphinx-pss probes pssparser's doc-comment support at first parse.
      # Checking it as its own step means an incapable parser reports as
      # itself rather than as a wall of test failures.
      run: |
        . .venv/bin/activate
        python -c "from sphinx_pss._capability import check_pssparser as c; print('pssparser', c())"

    - name: Install Graphviz
      # Flowcharts and activity diagrams are drawn with dot. Without it, the
      # Graphviz tests skip and the -W docs build below fails on the one
      # missing-dot warning, which is the point: the published docs must have
      # their diagrams.
      run: dnf install -y graphviz

    - name: Run the test suite
      run: |
        . .venv/bin/activate
        python -m pytest -m "unit or sphinx or upstream" -q --tb=short

    - name: Build the documentation
      # -W so documentation rot fails the build. The docs dogfood the extension
      # on the test fixtures, which makes this the broadest integration check
      # in the workflow.
      run: |
        . .venv/bin/activate
        python -m sphinx -W -b html docs docs/_build/html

    - name: Upload documentation
      uses: forgejo/upload-artifact@v4
      with:
        name: docs-sphinx-pss
        path: docs/_build/html/**
        if-no-files-found: error

# Nightly corpus run for psstools/sphinx-pss.
#
# The `corpus` marker is opt-in (pyproject.toml deselects it by default) because
# it runs the model over pss-corpus (fetched into packages/pss-corpus by ivpm)
# and is slow. It is also the check most likely to surface an upstream parser
# change, so it runs every night against whatever pssparser's default branch
# currently is -- deliberately unpinned, so drift shows up here rather than in
# somebody's build.
name: Nightly corpus

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  PY: /opt/python/cp312-cp312/bin/python

jobs:
  corpus:
    runs-on: ubuntu-latest
    container:
      image: dvkit/pssparser-ci:manylinux_2_28-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Configure ivpm dependency resolution
      run: |
        mkdir -p ~/.config/ivpm
        cat > ~/.config/ivpm/config.yaml <<'EOF'
        git-url-map:
          - from: "https://github.com/mballance-utils/"
            to:   "https://git.dvkit.org/mballance-utils/"
          - from: "https://github.com/psstools/"
            to:   "https://git.dvkit.org/psstools/"
          - from: "https://github.com/fvutils/"
            to:   "https://git.dvkit.org/fvutils/"
        git-auth:
          - host: "git.dvkit.org"
            order: ["https"]
        EOF

    - name: Fetch and build dependencies
      # default-dev, named explicitly: it is the dep-set that carries
      # pss-corpus, which the corpus tests fail without (tests/corpus/conftest.py).
      run: |
        export IVPM_PYTHON=${PY}
        ${IVPM_PYTHON} -m ivpm update -j 1 -a -d default-dev

    - name: Install sphinx-pss
      # --no-deps is load-bearing: ivpm has already installed every dependency,
      # and the pssparser it built from source reports version 0.0.0 (only a
      # release tag carries a real number). Resolving would see the pyproject
      # floor unmet and replace the source-built parser with a PyPI release,
      # which is what the push CI tests already (ci.yml).
      run: |
        . packages/python/bin/activate
        # ivpm creates packages/python with uv, which installs no pip.
        python -m ensurepip --upgrade
        python -m pip install --no-deps --no-build-isolation -e .

    - name: Install Graphviz
      # The docs-build test draws flowcharts and activity diagrams with dot.
      run: dnf install -y graphviz

    - name: Run the full suite including the corpus
      run: |
        . packages/python/bin/activate
        python -m pytest -m "unit or sphinx or upstream or corpus" -q --tb=short

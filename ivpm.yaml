package:
  name: sphinx-pss

  dep-sets:
  - name: default
    deps:
    - name: pssparser
      url: https://git.dvkit.org/psstools/pssparser.git
    # The PSS Pygments lexer. Registered through a pygments.lexers entry
    # point, so installing it is the whole configuration step -- this
    # extension makes no add_lexer call.
    - name: pygments-pss
      url: https://git.dvkit.org/psstools/pygments-pss.git
    - name: sphinx
      src: pypi
    # Documentation build.
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    # Test suite.
    - name: pytest
      src: pypi
    - name: beautifulsoup4
      src: pypi
    # The mermaid diagram back-end's tests (tests/autodoc/test_diagrams.py).
    - name: sphinxcontrib-mermaid
      src: pypi

  - name: default-dev
    deps:
    - name: pssparser
      url: https://git.dvkit.org/psstools/pssparser.git
    # The PSS Pygments lexer. Registered through a pygments.lexers entry
    # point, so installing it is the whole configuration step -- this
    # extension makes no add_lexer call.
    - name: pygments-pss
      url: https://git.dvkit.org/psstools/pygments-pss.git
    - name: sphinx
      src: pypi
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    - name: pytest
      src: pypi
    - name: beautifulsoup4
      src: pypi
    # The mermaid diagram back-end's tests (tests/autodoc/test_diagrams.py).
    - name: sphinxcontrib-mermaid
      src: pypi

    # The shared .pss corpus (pss-corpus/README.md), read by the opt-in
    # `corpus` tests. Test data: `type: raw` because there is nothing to build
    # or install. `default-dev` only: nothing under src/ reads it, and a
    # released wheel has no business depending on test data. The URL names
    # the upstream, like this file's other entries (pss-corpus PLAN.md C-2).
    - name: pss-corpus
      url: https://git.dvkit.org/psstools/pss-corpus.git
      type: raw

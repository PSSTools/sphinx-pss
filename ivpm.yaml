package:
  name: sphinx-pss

  dep-sets:
  - name: default
    deps:
    - name: pssparser
      url: https://git.dvkit.org/psstools/pssparser.git
    # The PSS Pygments lexer. Registered through a pygments.lexers entry
    # point, so installing it is the whole configuration step -- this
    # extension makes no add_lexer call.
    - name: pygments-pss
      url: https://git.dvkit.org/psstools/pygments-pss.git
    - name: sphinx
      src: pypi
    # Documentation build.
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    # Test suite.
    - name: pytest
      src: pypi
    - name: beautifulsoup4
      src: pypi

  - name: default-dev
    deps:
    - name: pssparser
      url: https://git.dvkit.org/psstools/pssparser.git
    # The PSS Pygments lexer. Registered through a pygments.lexers entry
    # point, so installing it is the whole configuration step -- this
    # extension makes no add_lexer call.
    - name: pygments-pss
      url: https://git.dvkit.org/psstools/pygments-pss.git
    - name: sphinx
      src: pypi
    - name: myst-parser
      src: pypi
    - name: furo
      src: pypi
    - name: pytest
      src: pypi
    - name: beautifulsoup4
      src: pypi

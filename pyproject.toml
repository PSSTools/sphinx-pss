[build-system]
# 77, not 68: `license = "Apache-2.0"` is a PEP 639 license expression only
# from setuptools 77. Older versions accept the same line as free-text and emit
# `License:` instead of `License-Expression:`, so the floor is what makes a
# rebuild from the sdist produce the same metadata as the released wheel.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-pss"
dynamic = ["version"]
description = "Sphinx autodoc support for Accellera PSS (Portable Test and Stimulus Standard) source"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Matthew Ballance", email = "matt.ballance@gmail.com" },
]
keywords = ["sphinx", "pss", "portable-stimulus", "documentation", "accellera"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation :: Sphinx",
]
dependencies = [
    "sphinx>=8.0",
    # A PSS 3.1 parser. pssparser versions as <PSS major>.<PSS minor>.<patch>,
    # so this names the LRM revision targeted, not a capability: the
    # doc-comment support this project needs is asserted at run time by
    # sphinx_pss._capability. 3.1.0 is the first release targeting 3.1, and the
    # suite passes against every published 3.1 release. A floor rather than a
    # pin, so a parser retargeted to a newer LRM still resolves. See
    # design/pssparser-followup-plan.md section 4.
    "pssparser>=3.1.0",
    # The PSS Pygments lexer. A hard dependency rather than an extra: without
    # it a ``pss`` code block renders as plain text, and warns -- failing any
    # ``-W`` build -- in exactly the projects this extension exists to serve.
    # It registers itself through a ``pygments.lexers`` entry point, so
    # nothing here calls ``add_lexer``; the dependency *is* the wiring.
    "pygments-pss>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "beautifulsoup4",
    # tests/corpus reads pss-corpus's manifest.toml; tomllib is stdlib from 3.11.
    "tomli; python_version < '3.11'",
    # The mermaid diagram back-end's tests; they skip without it.
    "sphinxcontrib-mermaid",
]
docs = [
    "myst-parser",
    "furo",
]
# pss_diagrams = "mermaid". The graphviz back-end needs only Sphinx, plus
# Graphviz's dot, which isn't a Python package.
mermaid = [
    "sphinxcontrib-mermaid",
]

# The SPSS001 migration checker (sphinx_pss.checkers), for `pssparser` on the
# command line. It is off until a project enables it.
[project.entry-points."pssparser.extensions"]
sphinx-pss = "sphinx_pss.checkers"

[project.urls]
# Deliberately only a Homepage, and not a repository link: this project lives
# on git.dvkit.org, which serves git clones rather than browsable pages, and
# github.com/psstools/sphinx-pss does not exist. A released version's metadata
# can never be edited, so a dead link here would be permanent. Add a Source
# URL when there is a public mirror to point at. (pygments-pss made the same
# call; pssparser publishes with no project URLs at all.)
Homepage = "https://accellera.org/downloads/standards/portable-stimulus"

[tool.setuptools.dynamic]
version = { attr = "sphinx_pss.__version__._pkg_version" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sphinx_pss = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure-Python tests with no Sphinx application",
    "sphinx: integration tests driving a Sphinx build over tests/roots/",
    "corpus: slow tests over pss-corpus (opt-in; packages/pss-corpus or $PSS_CORPUS)",
    "upstream: asserts a pssparser behavior sphinx-pss depends on; a failure, not a skip",
]
addopts = "-m 'not corpus'"
